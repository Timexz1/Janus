name: Deploy Supabase migrations

# Push to master that touches supabase/migrations/** → migrations are applied to
# the cloud project automatically (no manual SQL, no `db push` by hand). Can also
# be run on demand from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch: {}

# Avoid overlapping deploys racing on the same database.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: nedplvjmiyjkkusbemof
      # Authenticated GitHub API calls (setup-cli release lookup) avoid the
      # unauthenticated shared-runner rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not "latest") so the install is a direct asset download and
          # never hits the rate-limited "resolve latest release" GitHub API call.
          version: 2.102.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        # --include-all applies pending migrations even if a new file sorts before
        # an already-applied one (can happen with parallel development).
        run: supabase db push --include-all

      - name: Show applied migrations
        if: always()
        run: supabase migration list
